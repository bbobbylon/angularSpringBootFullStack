# This is the MySQL config, following the tutorial.
jwt:
  secret: ${JWT_SECRET}
  # myCrazySecretSecretKey
  #jwt.secret: ${JWT_SECRET}
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db2
    username: root
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true
    generate-ddl: true
  sql:
    init:
      # "never" means schema.sql is NOT run on startup — existing DB is used as-is.
      # To apply schema changes (new columns, tables, etc.), either:
      #   1. Run ALTER TABLE manually in your DB client, OR
      #   2. Temporarily set the mode to "always", restart, then set back to "never".
      # WARNING: "always" drops and recreates all tables, wiping all existing data.
      mode: never
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      path: /user/error
      whitelabel:
        enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    # Username and password come from the MAIL_USERNAME / MAIL_PASSWORD environment
    # variables — see README "Configure Email Environment Variables" for setup.
    # NEVER hardcode the Gmail app password here; it will end up in git history.
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          writetimeout: 5000
          timeout: 5000
          connectiontimeout: 5000
          auth: true
          starttls:
            enable: true
            required: true
