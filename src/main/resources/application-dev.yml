# This is the MySQL config, following the tutorial.
jwt:
  secret: myCrazySecretSecretKey
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db2
    username: root
    password: password
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true
    generate-ddl: true
  sql:
    init:
      # "never" means schema.sql is NOT run on startup — existing DB is used as-is.
      # To apply schema changes (new columns, tables, etc.), either:
      #   1. Run ALTER TABLE manually in your DB client, OR
      #   2. Temporarily set mode to "always", restart, then set back to "never".
      # WARNING: "always" drops and recreates all tables, wiping all existing data.
      mode: never
      continue-on-error: true
  web:
    error:
      path: /user/error
      whitelabel:
        enabled: false
