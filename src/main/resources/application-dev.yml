# This is the MySQL config, following the tutorial.
jwt:
  secret: myCrazySecretSecretKey
  #jwt.secret: ${JWT_SECRET}
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db2
    username: root
    password: password
  # Flyway is the single source of truth for schema. On startup it scans
  # classpath:db/migration for V<N>__*.sql files, applies anything not yet
  # in flyway_schema_history, and then hands the DB over to Hibernate to validate.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Required for native-MySQL databases that already have tables but no
    # flyway_schema_history — Flyway records V1 as the baseline and skips it.
    baseline-on-migrate: true
    baseline-version: 0
    # Stop the app from booting if a migration fails — safer than half-migrated DBs.
    out-of-order: false
  jpa:
    show-sql: true
    hibernate:
      # validate: Hibernate compares entity mappings against the live schema and
      # fails fast on mismatch — it NEVER alters or creates tables. All structure
      # changes go through Flyway migrations.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    # generate-ddl removed: paired with ddl-auto: validate it is a no-op, and
    # leaving it true is misleading to future readers.
  sql:
    init:
      # never: schema.sql/data.sql are not used. Flyway owns initialization.
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      path: /user/error
      whitelabel:
        enabled: false
