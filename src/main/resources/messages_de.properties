# German bundle — see messages.properties for the mechanism and escaping notes.
# German phrases every action as a noun/infinitive phrase (e.g. "Rollen zuweisen") rather than
# forcing the English "to {0}" shape through a zu-infinitive, which would need per-verb case
# agreement the shared template can't express; "Fehlende Berechtigung: {0}" reads naturally
# as a label for any of them instead.

