# ─────────────────────────────────────────────────────────────────────────────
# Shared Spring Boot configuration (applies to every profile).
# Profile-specific overrides live in application-dev.yml / application-prod.yml.
#
# Values come from environment variables (see .env.example); the dev profile
# supplies safe local fallbacks so the app boots without a full .env.
#
# History: the project originally targeted PostgreSQL (per the tutorial) before
# standardizing on MySQL. The old commented-out datasource blocks were removed
# for clarity and remain in git history if PostgreSQL is ever revisited.
# ─────────────────────────────────────────────────────────────────────────────

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${CONTAINER_PORT:8080}
  # ── Reverse-proxy awareness ────────────────────────────────────────────────────────────
  # Controls whether Spring reconstructs the request's PUBLIC scheme/host/port from the
  # X-Forwarded-Proto / X-Forwarded-Host / X-Forwarded-Port headers a load balancer adds.
  #
  # Why it matters here specifically: OAuth2ClientConfig registers every provider with the
  # redirect-uri template "{baseUrl}/login/oauth2/code/{registrationId}", and {baseUrl} is
  # resolved per-request from what the servlet container believes it is serving. Behind an
  # ALB with this unset, the container sees a plain-HTTP request to its own task IP, so the
  # redirect_uri sent to Google/GitHub/Microsoft becomes "http://10.0.1.23:8080/login/..."
  # — a URL that is not registered in any provider console and is not reachable from a
  # browser. The provider answers redirect_uri_mismatch and federated login is dead in that
  # environment while working perfectly on localhost. `framework` makes Spring honour the
  # forwarded headers so {baseUrl} resolves to the real public origin instead.
  #
  # Left OFF (`none`) by default: trusting those headers when NOTHING strips them means any
  # caller can claim any origin. Turn it on only where a proxy you control is guaranteed to
  # be in front — every deployment path already does (aws/task-definition.json and the GCP /
  # Azure workflows set FORWARD_HEADERS_STRATEGY=framework).
  #
  # Note this is a SEPARATE concern from app.security.trusted-proxy-count, which governs
  # X-Forwarded-FOR (the client IP used by rate limiting and anomaly detection). Both need
  # setting behind a load balancer; neither implies the other.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  profiles:
    active: ${SPRING_ACTIVE_PROFILES:dev}  # Use SPRING_PROFILES_ACTIVE env var if set, otherwise default to "dev"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    # SQL logging is OFF by default (prod-safe: avoids leaking query text and the
    # per-statement overhead). Devs opt in with SHOW_SQL=true in their .env.
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: ${SHOW_SQL:false}
      # Validation happens at the controller boundary via @Valid + GlobalExceptionHandler,
      # not on every Hibernate flush — so a legitimate partial update never trips an
      # entity-level constraint. Keeps a single, predictable place for 400s.
      '[jakarta.persistence.validation.mode]': none
    generate-ddl: true
  sql:
    init:
      # schema.sql (src/main/resources/schema.sql) is the single, idempotent definition of
      # every JdbcTemplate-managed table. Flyway was removed — its baseline bookkeeping kept
      # desyncing from the live database and blocking startup — and schema.sql replaces it.
      #   mode: never  -> NOT run automatically; must be run by hand against every target DB.
      #   mode: always -> Spring Boot applies it on every startup. Safe to enable, because the
      #                   script is idempotent (CREATE TABLE IF NOT EXISTS / INSERT ... ON
      #                   DUPLICATE KEY) and contains NO DROP statements.
      # Set to always now that dev points at one shared Aiven database (start.sh DB=aiven):
      # whichever developer's machine boots the app next applies any schema.sql change that
      # hasn't been run against Aiven yet, instead of relying on someone remembering to run it
      # by hand in Workbench first (the gap that caused the userevents.detail 500 incident).
      # Any DDL made directly in Workbench should still be mirrored into schema.sql by hand —
      # this only replays what's in the file, it doesn't pull live schema back into git.
      # Hibernate ddl-auto:update still owns the JPA customer/invoice/services tables.
      mode: always
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      path: /user/error
      whitelabel:
        enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    # Username and password come from the MAIL_USERNAME / MAIL_PASSWORD environment
    # variables — see README "Configure Email Environment Variables" for setup.
    # NEVER hardcode the Gmail app password here; it will end up in git history.
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          writetimeout: 5000
          timeout: 5000
          connectiontimeout: 5000
          auth: true
          starttls:
            enable: true
            required: true
    verify:
      host: ${VERIFY_EMAIL_HOST}
logging:
  level:
    # Yauaa (the user-agent parser) prints a multi-line version banner plus config-load lines at
    # INFO whenever its analyzer initialises. RequestUtils now builds the analyzer once, so clamping
    # this to WARN keeps that one-time startup output quiet without losing real warnings/errors.
    nl.basjes.parse.useragent: WARN
    # To enable verbose debug logging during development, uncomment:
    #org.springframework.security: DEBUG
    #org.springframework.web: DEBUG
    #org.hibernate: DEBUG

ui:
  app:
    url: ${UI_APP_URL:http://localhost:4200}  # Use UI_APP_URL env var if set, otherwise default to http://localhost:3000

app:
  image:
    # Filesystem directory where uploaded profile images are written and served from.
    # Dev default lives under the user's home dir (cross-platform). In Docker/cloud,
    # set IMAGE_STORAGE_PATH to a MOUNTED VOLUME (e.g. /app/data/images) so images
    # survive container restarts — docker-compose maps the app-images volume there.
    # This property is used by LocalImageStorageService and WebMvcConfig. Ignored when
    # IMAGE_STORAGE_TYPE=s3 (images are stored in and served from S3 directly).
    storage-path: ${IMAGE_STORAGE_PATH:${user.home}/tesseraapp/images}
    # Storage backend selector: local (default) | s3
    # Switch to s3 for any multi-instance or ephemeral-disk deployment (ECS Fargate, etc.).
    # Activates S3ImageStorageService + AwsS3Config; requires aws.s3.bucket and aws.region.
    storage-type: ${IMAGE_STORAGE_TYPE:local}

  error:
    # Whether error responses may carry internal diagnostic detail (the `devMessage` and raw
    # `reason` fields) to the client. TRUE here so local debugging keeps the verbose bodies;
    # application-prod.yml pins it FALSE. Enforced by ErrorDetailScrubber at the serialization
    # boundary rather than per-handler, so it holds for every error path including future ones.
    expose-details: ${EXPOSE_ERROR_DETAILS:true}

  cors:
    # Browser origins allowed to call this API, comma-separated. Consumed by
    # AngularSpringBootFullStackApplication#corsFilter via setAllowedOriginPatterns, so
    # `*` wildcards are legal here even though allowCredentials(true) is on.
    #
    # The default below is DEV-oriented: it allows localhost plus the three RFC-1918
    # private ranges on any port, which is what lets you open the app from a phone on
    # your own wifi (the phone's origin is http://192.168.x.x:4200, not localhost).
    # Reaching those origins already requires being on the same LAN, so this widens the
    # browser check to match a boundary the network is already enforcing.
    #
    # PRODUCTION MUST OVERRIDE THIS with an explicit origin list — see
    # application-prod.yml. A deployed API that trusts private-range patterns would be
    # relying on a network boundary its clients are not behind.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.16.*.*:[*]}

  security:
    # How many reverse proxies sit between the internet and this app, i.e. how many hops append
    # to X-Forwarded-For on the way in. Read by TrustedProxyConfigurer → RequestUtils.
    #
    # 0 (the default) means "no proxy" and causes X-Forwarded-For to be IGNORED. That is not a
    # limitation, it is the point: the header is caller-supplied, so trusting it when nothing
    # rewrites it lets any client choose the address recorded against it — which would let a
    # caller rotate forged addresses past the rate limiter and forge a "familiar" network past
    # the FR-TPF-1 anomaly check.
    #
    # Set to the real hop count when deploying behind a load balancer — typically 1 for a single
    # ALB or Cloud Run front end, 2 with a CDN in front of that. Getting it WRONG IN EITHER
    # DIRECTION is harmful: too low collapses every user into the load balancer's address (the
    # rate limiter then throttles all users as one), too high trusts an attacker-supplied entry.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}

    anomaly:
      # Login-anomaly detection + step-up re-verification (SRS FR-TPF-1), read by
      # LoginRiskServiceImpl. Set ANOMALY_DETECTION_ENABLED=false to revert login to its
      # pre-FR-TPF-1 behaviour (first factor → existing 2FA branch → tokens) without
      # removing the code path — useful when demoing the app from a fresh network where
      # every sign-in would legitimately look new.
      enabled: ${ANOMALY_DETECTION_ENABLED:true}
      # How many DISTINCT device/network fingerprints form an account's baseline. The
      # backing query groups by fingerprint, so this bounds distinct devices, not rows —
      # a user cannot age their own baseline out by signing in repeatedly from one machine.
      history-limit: ${ANOMALY_HISTORY_LIMIT:50}

# AWS configuration — only required when app.image.storage-type=s3.
# Credentials are resolved by DefaultCredentialsProvider (env vars → ~/.aws → instance/task role).
# For ECS Fargate, attach a task role with s3:PutObject + s3:GetObject on the bucket instead
# of using static keys.
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:}

management:
  endpoints:
    web:
      exposure:
        include: health, info   # only expose these two publicly
  endpoint:
    health:
      show-details: never
