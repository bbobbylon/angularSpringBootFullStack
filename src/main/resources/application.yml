# ─────────────────────────────────────────────────────────────────────────────
# Shared Spring Boot configuration (applies to every profile).
# Profile-specific overrides live in application-dev.yml / application-prod.yml.
#
# Values come from environment variables (see .env.example); the dev profile
# supplies safe local fallbacks so the app boots without a full .env.
#
# History: the project originally targeted PostgreSQL (per the tutorial) before
# standardizing on MySQL. The old commented-out datasource blocks were removed
# for clarity and remain in git history if PostgreSQL is ever revisited.
# ─────────────────────────────────────────────────────────────────────────────

jwt:
  secret: ${JWT_SECRET}

org:
  idp:
    # Base64-encoded 32-byte AES-256-GCM key used by EncryptionUtil to encrypt/decrypt
    # per-organization SSO client secrets at rest (FUTURE-ENHANCEMENTS.md §3.1). Generate one:
    # openssl rand -base64 32
    secret-encryption-key: ${ORG_IDP_SECRET_ENCRYPTION_KEY}

server:
  port: ${CONTAINER_PORT:8080}
  # ── Reverse-proxy awareness ────────────────────────────────────────────────────────────
  # Controls whether Spring reconstructs the request's PUBLIC scheme/host/port from the
  # X-Forwarded-Proto / X-Forwarded-Host / X-Forwarded-Port headers a load balancer adds.
  #
  # Why it matters here specifically: OAuth2ClientConfig registers every provider with the
  # redirect-uri template "{baseUrl}/login/oauth2/code/{registrationId}", and {baseUrl} is
  # resolved per-request from what the servlet container believes it is serving. Behind an
  # ALB with this unset, the container sees a plain-HTTP request to its own task IP, so the
  # redirect_uri sent to Google/GitHub/Microsoft becomes "http://10.0.1.23:8080/login/..."
  # — a URL that is not registered in any provider console and is not reachable from a
  # browser. The provider answers redirect_uri_mismatch and federated login is dead in that
  # environment while working perfectly on localhost. `framework` makes Spring honour the
  # forwarded headers so {baseUrl} resolves to the real public origin instead.
  #
  # Left OFF (`none`) by default: trusting those headers when NOTHING strips them means any
  # caller can claim any origin. Turn it on only where a proxy you control is guaranteed to
  # be in front — every deployment path already does (aws/task-definition.json and the GCP /
  # Azure workflows set FORWARD_HEADERS_STRATEGY=framework).
  #
  # Note this is a SEPARATE concern from app.security.trusted-proxy-count, which governs
  # X-Forwarded-FOR (the client IP used by rate limiting and anomaly detection). Both need
  # setting behind a load balancer; neither implies the other.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  profiles:
    active: ${SPRING_ACTIVE_PROFILES:dev}  # Use SPRING_PROFILES_ACTIVE env var if set, otherwise default to "dev"
  datasource:
    # ── Transport security to the database ──────────────────────────────────────────────
    # This URL previously hardcoded `useSSL=false`, which sent credentials and every row in
    # plaintext. That is survivable against a MySQL on localhost and indefensible against a
    # managed database reached over the public internet — which is exactly what every
    # deployed profile (and `start.sh DB=aiven`) points at.
    #
    # `useSSL` is also the LEGACY switch. Connector/J 8.0.13+ replaced the useSSL/requireSSL
    # pair with the single `sslMode` enum, and mixing them is a common source of "I set
    # useSSL=true and nothing changed" confusion. The ladder:
    #
    #   DISABLED        no TLS at all — what this file used to pin
    #   PREFERRED       use TLS when the server offers it, silently fall back if not  ← default
    #   REQUIRED        refuse to connect without TLS; does NOT validate the certificate
    #   VERIFY_CA       REQUIRED + validate the server cert against a truststore
    #   VERIFY_IDENTITY VERIFY_CA + check the hostname matches the cert
    #
    # PREFERRED is the default here rather than DISABLED so a developer pointed at the shared
    # Aiven database gets an encrypted connection without configuring anything, while a bare
    # local MySQL with no certificate still starts. Deployed profiles pin REQUIRED (see
    # application-prod.yml / -qa / -stage), so a silent downgrade cannot happen where it counts.
    #
    # ⚠️ REQUIRED stops passive eavesdropping, NOT an active machine-in-the-middle — nothing
    # verifies whose certificate is on the other end. Closing that needs VERIFY_IDENTITY plus
    # Aiven's project CA in a truststore inside the container; verified 2026-08-04 that
    # VERIFY_IDENTITY fails with "CA certificate is required" until that CA is supplied.
    # Tracked in documentation/FUTURE-ENHANCEMENTS.md.
    #
    # allowPublicKeyRetrieval only matters for caching_sha2_password over an UNENCRYPTED
    # connection, where it lets a MITM substitute the server's RSA key. Once TLS is required it
    # is unnecessary, so the deployed profiles turn it off.
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?sslMode=${MYSQL_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    # Close the EntityManager when the service method returns, instead of holding it open for the
    # whole request while the view renders. Boot leaves this ON by default and warns about it at
    # every startup ("spring.jpa.open-in-view is enabled by default...").
    #
    # Safe to turn off here because every JPA association in this codebase is EAGER — Customer's
    # invoices and Invoice's line items are both fetched inside the repository call (see the
    # @BatchSize notes on those fields), so nothing is left uninitialised for Jackson to touch
    # during serialisation and there is no LazyInitializationException to inherit.
    #
    # The real win is connection hold time: with it on, a pooled connection stays checked out until
    # the response is fully written, so slow serialisation or a slow client occupies a database
    # connection that is doing nothing. It also makes any future LAZY mapping fail loudly at
    # development time rather than silently issuing extra queries mid-render.
    open-in-view: false
    # SQL logging is OFF by default (prod-safe: avoids leaking query text and the
    # per-statement overhead). Devs opt in with SHOW_SQL=true in their .env.
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: ${SHOW_SQL:false}
      # Validation happens at the controller boundary via @Valid + GlobalExceptionHandler,
      # not on every Hibernate flush — so a legitimate partial update never trips an
      # entity-level constraint. Keeps a single, predictable place for 400s.
      '[jakarta.persistence.validation.mode]': none
    generate-ddl: true
  sql:
    init:
      # schema.sql (src/main/resources/schema.sql) is the single, idempotent definition of
      # every JdbcTemplate-managed table. Flyway was removed — its baseline bookkeeping kept
      # desyncing from the live database and blocking startup — and schema.sql replaces it.
      #   mode: never  -> NOT run automatically; must be run by hand against every target DB.
      #   mode: always -> Spring Boot applies it on every startup. Safe to enable, because the
      #                   script is idempotent (CREATE TABLE IF NOT EXISTS / INSERT ... ON
      #                   DUPLICATE KEY) and contains NO DROP statements.
      # Set to always now that dev points at one shared Aiven database (start.sh DB=aiven):
      # whichever developer's machine boots the app next applies any schema.sql change that
      # hasn't been run against Aiven yet, instead of relying on someone remembering to run it
      # by hand in Workbench first (the gap that caused the userevents.detail 500 incident).
      # Any DDL made directly in Workbench should still be mirrored into schema.sql by hand —
      # this only replays what's in the file, it doesn't pull live schema back into git.
      # Hibernate ddl-auto:update still owns the JPA customer/invoice/services tables.
      mode: always
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      path: /user/error
      whitelabel:
        enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    # Username and password come from the MAIL_USERNAME / MAIL_PASSWORD environment
    # variables — see README "Configure Email Environment Variables" for setup.
    # NEVER hardcode the Gmail app password here; it will end up in git history.
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          writetimeout: 5000
          timeout: 5000
          connectiontimeout: 5000
          auth: true
          starttls:
            enable: true
            required: true
    verify:
      host: ${VERIFY_EMAIL_HOST}
# ── Logging ───────────────────────────────────────────────────────────────────────────────
# Levels are ENVIRONMENT-DRIVEN rather than commented-out source lines, so verbosity can be
# raised on an already-deployed container (ECS task definition, docker-compose, .env) without
# a code change, a rebuild, or a new image. Same opt-in shape as SHOW_SQL: safe default,
# explicit override. Every default below is the value the app ran with before this block
# existed, so behaviour is unchanged until a variable is actually set.
#
# On ECS these are plain `environment` entries in aws/task-definition.json, which are baked
# into a task-definition REVISION — changing one therefore requires re-registering the task
# definition, not just restarting the service (see RUNBOOK Part D).
#
# ⚠️ Free-tier note: CloudWatch Logs bills ingestion beyond 5 GB/month, and
# org.springframework.security at DEBUG logs the entire filter chain FOR EVERY REQUEST — it is
# by far the fastest way to spend that allowance. Turn it on to diagnose a specific problem,
# then put it back to INFO. It also prints request details, so it is a disclosure risk if the
# log group is readable by anyone who should not see them.
logging:
  level:
    # Yauaa (the user-agent parser) prints a multi-line version banner plus config-load lines at
    # INFO whenever its analyzer initialises. RequestUtils now builds the analyzer once, so clamping
    # this to WARN keeps that one-time startup output quiet without losing real warnings/errors.
    nl.basjes.parse.useragent: WARN

    # This application's own packages — controllers, services, repos, AuthDiagnosticsLogger,
    # NewUserEventListener. DEBUG here is the cheap, targeted first move when something is wrong
    # in OUR code, and it stays far quieter than turning up a framework package.
    com.bob.angularspringbootfullstack: ${LOG_LEVEL_APP:INFO}

    # Spring Security's filter chain. DEBUG explains WHY a request was rejected — which matcher
    # matched, which authority was missing. The natural companion to a [RBAC-DENY] line that does
    # not obviously explain itself. Extremely chatty; see the free-tier warning above.
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}

    # Spring MVC request mapping and dispatch. DEBUG shows which handler a URL resolved to,
    # useful when a route 404s in the deployed jar but works locally (the SPA-forwarding rules in
    # WebMvcConfig only apply when Angular is served from the same origin, i.e. prod, not dev).
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}

    # Hibernate.
    #
    # ⚠️ DEBUG HERE *DOES* PRINT SQL, and `show-sql: false` does NOT prevent it. These are two
    # independent mechanisms and it is easy to assume otherwise:
    #   • spring.jpa.show-sql=true  → Hibernate writes statements to System.out, prefixed "Hibernate: ".
    #     This is what application-prod.yml pins to false.
    #   • logger org.hibernate.SQL at DEBUG → Hibernate logs the same statements through SLF4J/Logback.
    #     Completely separate path. show-sql has no effect on it whatsoever.
    # So LOG_LEVEL_HIBERNATE=DEBUG puts query text into CloudWatch even under the prod profile.
    # Statements are emitted with `?` placeholders rather than bound values, so this discloses the
    # SCHEMA (tables, columns, join shape) rather than row data — still a map of the system, and not
    # something to leave switched on. Confirmed on ECS 2026-08-02: 546 org.hibernate.SQL events in
    # 15 minutes with prod's show-sql:false in force.
    org.hibernate: ${LOG_LEVEL_HIBERNATE:INFO}

# Spring Boot's auto-configuration report — logged at startup under the header
# "CONDITIONS EVALUATION REPORT" (note: plural CONDITIONS; grepping for the singular finds
# nothing). Lists which @Conditional beans matched, which did not, and why. This is the
# PRODUCTION-AVAILABLE equivalent of the "CONDITION EVALUATION DELTA" that spring-boot-devtools
# prints on a local restart — devtools is excluded from the packaged jar, so that delta cannot
# exist on ECS. Answers questions like "did S3ImageStorageService actually activate in this
# container, or did it silently fall back to LocalImageStorageService?" (verified on ECS
# 2026-08-02: prints `S3ImageStorageService matched`, the inverse of a local run).
#
# ⚠️ `debug` IS MUCH BROADER THAN ITS NAME SUGGESTS — DO NOT LEAVE IT ON IN PRODUCTION.
# Spring Boot's debug mode does not only emit the report; it switches a selection of core loggers
# to DEBUG, and **Hibernate is one of them**. That turns on org.hibernate.SQL, which logs every
# statement through SLF4J — a path spring.jpa.show-sql=false does NOT close (see the Hibernate
# note above). Setting DEBUG_REPORT=true therefore reopens exactly the query-text disclosure the
# prod profile's show-sql:false was written to prevent.
#
# Measured on ECS 2026-08-02 with this flag on: the report itself is ~930 lines once per boot,
# plus ~2-3 DEBUG lines per ALB health check forever, PLUS 546 org.hibernate.SQL statements in a
# single 15-minute window of ordinary browsing (~390 MB/month projected, ~8% of the CloudWatch
# free tier). Reverted to false in task-definition revision 11 the same day.
#
# Use it briefly, to answer a specific question, on a deployment nobody else is using — then
# turn it straight back off.
#
# If you ever want the report WITHOUT debug mode's other effects, leave DEBUG_REPORT=false and
# instead set this single logger to DEBUG — it emits the same report and nothing else:
#   logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=DEBUG
debug: ${DEBUG_REPORT:false}

ui:
  app:
    url: ${UI_APP_URL:http://localhost:4200}  # Use UI_APP_URL env var if set, otherwise default to http://localhost:3000

app:
  image:
    # Filesystem directory where uploaded profile images are written and served from.
    # Dev default lives under the user's home dir (cross-platform). In Docker/cloud,
    # set IMAGE_STORAGE_PATH to a MOUNTED VOLUME (e.g. /app/data/images) so images
    # survive container restarts — docker-compose maps the app-images volume there.
    # This property is used by LocalImageStorageService and WebMvcConfig. Ignored when
    # IMAGE_STORAGE_TYPE=s3 (images are stored in and served from S3 directly).
    storage-path: ${IMAGE_STORAGE_PATH:${user.home}/tesseraapp/images}
    # Storage backend selector: local (default) | s3
    # Switch to s3 for any multi-instance or ephemeral-disk deployment (ECS Fargate, etc.).
    # Activates S3ImageStorageService + AwsS3Config; requires aws.s3.bucket and aws.region.
    storage-type: ${IMAGE_STORAGE_TYPE:local}

  error:
    # Whether error responses may carry internal diagnostic detail (the `devMessage` and raw
    # `reason` fields) to the client. TRUE here so local debugging keeps the verbose bodies;
    # application-prod.yml pins it FALSE. Enforced by ErrorDetailScrubber at the serialization
    # boundary rather than per-handler, so it holds for every error path including future ones.
    expose-details: ${EXPOSE_ERROR_DETAILS:true}

  cors:
    # Browser origins allowed to call this API, comma-separated. Consumed by
    # AngularSpringBootFullStackApplication#corsFilter via setAllowedOriginPatterns, so
    # `*` wildcards are legal here even though allowCredentials(true) is on.
    #
    # The default below is DEV-oriented: it allows localhost plus the three RFC-1918
    # private ranges on any port, which is what lets you open the app from a phone on
    # your own wifi (the phone's origin is http://192.168.x.x:4200, not localhost).
    # Reaching those origins already requires being on the same LAN, so this widens the
    # browser check to match a boundary the network is already enforcing.
    #
    # PRODUCTION MUST OVERRIDE THIS with an explicit origin list — see
    # application-prod.yml. A deployed API that trusts private-range patterns would be
    # relying on a network boundary its clients are not behind.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.16.*.*:[*]}

  security:
    # How many reverse proxies sit between the internet and this app, i.e. how many hops append
    # to X-Forwarded-For on the way in. Read by TrustedProxyConfigurer → RequestUtils.
    #
    # 0 (the default) means "no proxy" and causes X-Forwarded-For to be IGNORED. That is not a
    # limitation, it is the point: the header is caller-supplied, so trusting it when nothing
    # rewrites it lets any client choose the address recorded against it — which would let a
    # caller rotate forged addresses past the rate limiter and forge a "familiar" network past
    # the FR-TPF-1 anomaly check.
    #
    # Set to the real hop count when deploying behind a load balancer — typically 1 for a single
    # ALB or Cloud Run front end, 2 with a CDN in front of that. Getting it WRONG IN EITHER
    # DIRECTION is harmful: too low collapses every user into the load balancer's address (the
    # rate limiter then throttles all users as one), too high trusts an attacker-supplied entry.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}

    # Comma-separated email-domain allowlist for the admin user-type badge's INTERNAL/EXTERNAL
    # split (P2-1), read by AdminUserController. E.g. "lewisu.edu,tesseraapp.dev". Blank (the
    # default) means nothing qualifies as INTERNAL, so every non-federated account reads EXTERNAL
    # — the safe default until someone configures this deliberately. FEDERATED accounts (created
    # via Google/GitHub/Microsoft) always read FEDERATED regardless of this list.
    internal-domains: ${INTERNAL_DOMAINS:}

    anomaly:
      # Login-anomaly detection + step-up re-verification (SRS FR-TPF-1), read by
      # LoginRiskServiceImpl. Set ANOMALY_DETECTION_ENABLED=false to revert login to its
      # pre-FR-TPF-1 behaviour (first factor → existing 2FA branch → tokens) without
      # removing the code path — useful when demoing the app from a fresh network where
      # every sign-in would legitimately look new.
      enabled: ${ANOMALY_DETECTION_ENABLED:true}
      # How many DISTINCT device/network fingerprints form an account's baseline. The
      # backing query groups by fingerprint, so this bounds distinct devices, not rows —
      # a user cannot age their own baseline out by signing in repeatedly from one machine.
      history-limit: ${ANOMALY_HISTORY_LIMIT:50}

# Scheduled/on-demand report digest emails (POST-SUBMISSION-UPGRADES.md), read by
# SchedulingConfig and ReportDigestServiceImpl.
report:
  digest:
    # Standard cron (second-first, Spring's format) for the weekly digest run: every active
    # organization's admins get their org digest, then every system administrator (plus any
    # admin-extra-recipients below) gets the system-wide digest. Default fires Monday 06:00
    # server time. See SchedulingConfig for what one run actually sends.
    cron: ${REPORT_DIGEST_CRON:0 0 6 * * MON}
    # Comma-separated extra addresses to CC on the system-wide digest — e.g. a shared ops
    # mailbox that isn't itself a ROLE_ADMIN/ROLE_APPLICATION_ADMIN account. Blank/unset
    # (the default) sends only to the resolved system administrators.
    admin-extra-recipients: ${REPORT_ADMIN_EXTRA_RECIPIENTS:}

# AWS configuration — only required when app.image.storage-type=s3.
# Credentials are resolved by DefaultCredentialsProvider (env vars → ~/.aws → instance/task role).
# For ECS Fargate, attach a task role with s3:PutObject + s3:GetObject on the bucket instead
# of using static keys.
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${AWS_S3_BUCKET:}

security:
  rate-limit:
    # Per-IP, per-minute request budgets enforced by RateLimitFilter (@Order(-200), so it runs
    # before Spring Security does any JWT work). These defaults ARE the production values — the
    # properties exist so a specific environment can move them, not so the shipped limits change.
    #
    # The auth tier is tight on purpose: /user/login, /user/register, /user/refresh/token and the
    # verification endpoints are the ones worth brute-forcing.
    #
    # The E2E stack raises both (see .env.e2e.example). Not a weakening of the control so much as
    # an acknowledgement that the suite is a false positive for it: inside Docker every request
    # from the host arrives from one bridge-gateway IP, so a fourteen-test run is one client
    # issuing a burst — which is precisely the shape the limiter exists to reject. The limiter is
    # still covered there, deliberately, by e2e/rate-limit.spec.ts.
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
    global-capacity: ${RATE_LIMIT_GLOBAL_CAPACITY:200}

management:
  endpoints:
    web:
      exposure:
        # health/info stay unauthenticated (SecurityConfig permitAll's them — the ALB target
        # group and the ECS container health check both hit /actuator/health with no token,
        # see aws/setup.sh and aws/task-definition.json). metrics is exposed here but is NOT
        # public: SecurityConfig gates every other /actuator/** path behind the same
        # UPDATE:USER/UPDATE:ROLE authority /admin/** requires, because per-EventType counts
        # (login failures, suspicious logins, token-reuse detections…) are operational data an
        # unauthenticated caller should not be able to read.
        include: health, info, metrics
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # Deliberately OFF. `spring-boot-starter-mail` + a configured `spring.mail.host` makes
      # Spring Boot auto-register a MailHealthIndicator that opens a real SMTP connection on
      # EVERY health probe. Nobody opted into that — it arrives with the starter — and it
      # quietly wires an optional feature into the signal that decides whether this instance
      # lives or dies:
      #
      #   • /actuator/health is what the ALB target group and the ECS container health check
      #     poll (see the exposure comment above, aws/setup.sh, aws/task-definition.json).
      #   • So in prod every probe did a TCP+TLS handshake to smtp.gmail.com, and a Gmail
      #     hiccup or a connect-rate throttle would flip health to 503 → ALB drains the
      #     targets → ECS replaces a task that could still serve every request except sending
      #     an email. An email outage became a full application outage.
      #   • The connect timeout is 5s, so a hanging SMTP host also stalls each probe long
      #     enough to trip the healthcheck's own 5s timeout.
      #
      # A health check answers "should traffic be routed here?", not "is every downstream
      # dependency perfect?". Undeliverable mail is a degraded feature, not a reason to stop
      # serving. This was found by the E2E stack (MAIL_HOST has no listener there, so the app
      # served fine on / but reported DOWN forever and never became healthy) — but the
      # production consequence above is the actual reason it is disabled everywhere.
      #
      # Trade-off accepted: we lose the passive signal that SMTP is misconfigured. That is
      # covered instead by EmailServiceImpl logging every send failure, and by the audit
      # events surfaced through /actuator/metrics — observability, not admission control.
      enabled: false
