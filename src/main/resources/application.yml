# ─────────────────────────────────────────────────────────────────────────────
# Shared Spring Boot configuration (applies to every profile).
# Profile-specific overrides live in application-dev.yml / application-prod.yml.
#
# Values come from environment variables (see .env.example); the dev profile
# supplies safe local fallbacks so the app boots without a full .env.
#
# History: the project originally targeted PostgreSQL (per the tutorial) before
# standardizing on MySQL. The old commented-out datasource blocks were removed
# for clarity and remain in git history if PostgreSQL is ever revisited.
# ─────────────────────────────────────────────────────────────────────────────

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${CONTAINER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_ACTIVE_PROFILES:dev}  # Use SPRING_PROFILES_ACTIVE env var if set, otherwise default to "dev"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    # SQL logging is OFF by default (prod-safe: avoids leaking query text and the
    # per-statement overhead). Devs opt in with SHOW_SQL=true in their .env.
    show-sql: ${SHOW_SQL:false}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: ${SHOW_SQL:false}
      # Validation happens at the controller boundary via @Valid + GlobalExceptionHandler,
      # not on every Hibernate flush — so a legitimate partial update never trips an
      # entity-level constraint. Keeps a single, predictable place for 400s.
      '[jakarta.persistence.validation.mode]': none
    generate-ddl: true
  sql:
    init:
      # schema.sql (src/main/resources/schema.sql) is the single, idempotent definition of
      # every JdbcTemplate-managed table. Flyway was removed — its baseline bookkeeping kept
      # desyncing from the live database and blocking startup — and schema.sql replaces it.
      #   mode: never  -> NOT run automatically; run it by hand to initialise a fresh database
      #                   (e.g.  mysql -u root -p db2 < src/main/resources/schema.sql).
      #   mode: always -> Spring Boot applies it on every startup. Safe to enable, because the
      #                   script is idempotent (CREATE TABLE IF NOT EXISTS / INSERT ... ON
      #                   DUPLICATE KEY) and contains NO DROP statements.
      # Hibernate ddl-auto:update still owns the JPA customer/invoice/services tables.
      mode: never
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  web:
    error:
      path: /user/error
      whitelabel:
        enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    # Username and password come from the MAIL_USERNAME / MAIL_PASSWORD environment
    # variables — see README "Configure Email Environment Variables" for setup.
    # NEVER hardcode the Gmail app password here; it will end up in git history.
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          writetimeout: 5000
          timeout: 5000
          connectiontimeout: 5000
          auth: true
          starttls:
            enable: true
            required: true
    verify:
      host: ${VERIFY_EMAIL_HOST}
# To enable verbose debug logging during development, uncomment:
#logging:
#  level:
#    org.springframework.security: DEBUG
#    org.springframework.web: DEBUG
#    org.hibernate: DEBUG

ui:
  app:
    url: ${UI_APP_URL:http://localhost:4200}  # Use UI_APP_URL env var if set, otherwise default to http://localhost:3000

app:
  image:
    # Filesystem directory where uploaded profile images are written and served from.
    # Dev default lives under the user's home dir (cross-platform). In Docker/cloud,
    # set IMAGE_STORAGE_PATH to a MOUNTED VOLUME (e.g. /app/data/images) so images
    # survive container restarts — docker-compose maps the app-images volume there.
    storage-path: ${IMAGE_STORAGE_PATH:${user.home}/securecapita/images}

management:
  endpoints:
    web:
      exposure:
        include: health, info   # only expose these two publicly
  endpoint:
    health:
      show-details: never
