ui:
  app:
    url: ${UI_APP_URL:http://localhost:4200}  # Use UI_APP_URL env var if set, otherwise default to http://localhost:3000

management:
  endpoints:
    web:
      exposure:
        include: health, info   # only expose these two publicly
  endpoint:
    health:
      show-details: never
