# Backend-driven i18n (ROADMAP / FUTURE-ENHANCEMENTS.md §3.3) — English default bundle.
#
# Spring Boot's MessageSourceAutoConfiguration auto-registers a MessageSource bean from
# classpath:messages*.properties (basename "messages" is the unmodified default — see
# application.yml, which has no spring.messages override). Dropping this file and its
# locale variants (messages_es.properties, etc.) into this directory is the entire wiring;
# no explicit @Bean is needed.
#
# Keys here back CapabilityCatalog (see that class for the full rationale on why a 403's
# capability phrase is derived from the request rather than hardcoded per endpoint). This is
# deliberately the ONLY part of the backend translated in this pass — validation messages and
# email bodies are still English-only; CapabilityCatalog was called out in the roadmap as the
# natural first target because it already had a single shared message template.
#
# capability.messageTemplate uses MessageFormat's {0} placeholder, not String#format's %s —
# MessageSource#getMessage runs every value through java.text.MessageFormat. A literal
# apostrophe in a MessageFormat pattern opens a quoted (literal) span, so "don't" is escaped
# as "don''t" here; two adjacent single quotes render as one literal quote without starting a
# quoted span. The individual capability.* phrases below do NOT need that escaping — they are
# resolved with getMessage(key, null, locale), and MessageSource only applies MessageFormat
# when a non-null args array is passed, so a null-args lookup returns the raw string verbatim.

capability.default=perform this action
capability.messageTemplate=You don''t have permission to {0} — contact your administrator.

capability.assignRoles=assign roles
capability.changeAccountState=change account state
capability.editOtherUsersProfiles=edit other users' profiles
capability.changeSecuritySettings=change security settings
capability.viewSecurityMonitoring=view security monitoring
capability.viewBillingAnalytics=view billing and analytics
capability.manageServicesCatalog=manage the services catalog
capability.manageUsers=manage users
capability.accessAdministrativeFeatures=access administrative features
capability.deleteCustomers=delete customers
capability.deleteUsers=delete users
capability.editInvoices=edit invoices
capability.createInvoices=create invoices
capability.createCustomers=create customers
capability.updateCustomers=update customers
capability.workWithInvoices=work with invoices
capability.workWithCustomers=work with customers
