# ── Production runtime config ───────────────────────────────────────────────────────────
# Secrets and environment-specific values (DB credentials, JWT secret, mail credentials,
# UI/verification URLs) are read DIRECTLY from environment variables at their point of use in
# application.yml — e.g. datasource username: ${MYSQL_USERNAME}, jwt secret: ${JWT_SECRET}.
# Production deliberately supplies NO fallback for them, so a missing variable fails fast at
# startup instead of silently booting with an insecure default. Only non-secret values that
# are genuinely fixed for production are pinned here as literals.
#
# (Earlier revisions redeclared every variable self-referentially — e.g.
# `MYSQL_USERNAME: ${MYSQL_USERNAME}` — which resolves in a circle whenever the env var is
# absent and Boot 4 rejects with `Circular placeholder reference`. Those redundant
# pass-throughs were removed; base application.yml already reads each variable directly.)
SPRING_ACTIVE_PROFILES: prod

# DB port defaults to the MySQL standard; override with MYSQL_PORT if your server differs.
MYSQL_PORT: 3306

MAIL_HOST: smtp.gmail.com
MAIL_PORT: 587

# ── Production JPA hardening ────────────────────────────────────────────────────────────
# ddl-auto: validate — at startup Hibernate verifies the JPA-managed tables
# (Customer / Invoice / Services / invoiceserviceitems) match the entity mappings and FAILS FAST
# on any drift; it never auto-creates or alters the production schema (contrast the base profile's
# ddl-auto: update). Those tables must therefore already exist — they are defined in schema.sql,
# applied by hand to a fresh database (see the schema.sql header). show-sql is pinned off so query
# text is never logged in production, regardless of the SHOW_SQL environment variable.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# ── Production CORS ─────────────────────────────────────────────────────────────────────
# Overrides the base profile's dev default, which allows any RFC-1918 private-range origin
# so the app can be opened from a phone on the developer's own wifi. That default is safe
# only because reaching it requires already being on the LAN — an assumption that does not
# hold for a deployed API, whose clients arrive from the public internet.
#
# It falls back to UI_APP_URL — the SPA origin, which every deployment path already sets
# (aws/task-definition.json, .github/workflows/deploy.yml, deploy-gcp.yml) and which is
# already the right answer for a single-SPA deployment. That keeps the default CORRECT and
# narrow rather than absent: no pipeline has to learn a new variable, and no environment
# can silently inherit the dev profile's private-range patterns.
#
# Set CORS_ALLOWED_ORIGINS explicitly only when more than one origin must be allowed
# (e.g. an apex domain plus www), comma-separated:
#   CORS_ALLOWED_ORIGINS=https://app.example.com,https://www.example.com
#
# If UI_APP_URL is also unset the placeholder cannot resolve and startup fails — deliberate,
# and consistent with this profile's "no silent fallbacks" rule.
#
# Note this matters far less when the SPA and API are served from ONE origin behind a
# reverse proxy (the shape environment.production.ts assumes, with apiUrl: ''): those calls
# are same-origin and never trigger a CORS check at all. Keep it correct regardless — it is
# the boundary that catches a misconfigured split-origin deploy.
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:${UI_APP_URL}}

  # ── Production error hygiene ──────────────────────────────────────────────────────────
  # Suppresses `devMessage` and the raw `reason` on error responses. Raw exception text names
  # tables, columns, class names and (on the auth paths) the identifier that was looked up —
  # collectively a map of the system, and on login specifically it would undercut the
  # anti-enumeration guarantee. Nothing is lost: every handler already logs the full exception
  # server-side, so operators read the detail in the application log instead of the client
  # reading it in the response. Hardcoded rather than env-driven — there is no legitimate reason
  # to turn this back on in production.
  error:
    expose-details: false
