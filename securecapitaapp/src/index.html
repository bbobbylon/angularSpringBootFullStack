<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Set the color mode before first paint to avoid a flash of the wrong theme.
       Reads the persisted choice, falling back to the OS preference (default dark).
       Kept in lockstep with ThemeService (src/app/service/theme.service.ts). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sc-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    })();
  </script>
  <title>SecureCapita</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SecureCapita - Secure capital management application">
  <meta name="theme-color" content="#0d6efd">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
    crossorigin="anonymous">
</head>
<body>
  <app-root></app-root>
</body>
</html>
