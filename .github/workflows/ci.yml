# ──────────────────────────────────────────────────────────────────────────────
# CI — build, lint, and test on every push and PR.
#
# Database: a local MySQL 8 service container — Aiven (the production/staging DB)
# is NOT used in CI. Tests run against a throwaway schema so they are isolated
# and fast without incurring Aiven connection limits or costs.
#
# Secrets required (Settings → Secrets → Actions):
#   CI_JWT_SECRET  — any string ≥ 32 chars (a random one is fine for tests)
#   CI_MAIL_USERNAME, CI_MAIL_PASSWORD — only needed if email-sending tests exist
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — Maven build + tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: tessera_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      # Spring profile for CI — uses dev defaults but points at the MySQL service above
      SPRING_ACTIVE_PROFILES: dev
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: tessera_ci
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ci_root_password
      # CI-only JWT secret — never used outside this runner
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      # Mail is not exercised in CI tests; supply stubs so the context loads
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USERNAME: ${{ secrets.CI_MAIL_USERNAME || 'ci-stub@example.com' }}
      MAIL_PASSWORD: ${{ secrets.CI_MAIL_PASSWORD || 'stub' }}
      VERIFY_EMAIL_HOST: http://localhost:8080
      UI_APP_URL: http://localhost:4200
      IMAGE_STORAGE_TYPE: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Apply schema.sql to CI database
        run: |
          mysql -h 127.0.0.1 -u root -pci_root_password tessera_ci \
            < src/main/resources/schema.sql

      - name: Build and test (Maven)
        run: mvn --no-transfer-progress verify

  frontend:
    name: Frontend — Angular test + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tesseraapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tesseraapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Dependency CVE scan for the frontend. The backend half of this pipeline has been
      # covered all along (`mvn verify` runs OWASP dependency-check and fails on CVSS >= 7),
      # but the Angular tree — by far the larger dependency graph — was never scanned.
      #
      # --audit-level=high fails the job only on high/critical advisories. Moderate findings
      # are reported without breaking the build: the transitive dev-dependency churn in an
      # Angular workspace produces a steady trickle of them, and a gate that is red for
      # reasons nobody can act on gets ignored, which costs more than it catches.
      #
      # NOTE: this step could not be verified on the author's Windows machine — `npm audit`
      # there fails with "invalid json response body ... audit endpoint returned an error",
      # because npm receives a gzipped advisory response it does not decode. That is a local
      # npm/network condition (the payload starts with the gzip magic bytes), not a problem
      # with this configuration, and it does not reproduce on a clean Ubuntu runner. If it
      # ever does flake here, prefer `continue-on-error: true` over deleting the step, so
      # advisories stay visible even when the endpoint misbehaves.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Lint now GATES. It could not before: the workspace carried 12 standing errors (10 of them
      # real accessibility defects — labels with no control association, click handlers with no
      # keyboard equivalent), so a gate here would have been red from day one and promptly
      # ignored. Those are fixed, so the rule can finally be enforced rather than aspirational.
      #
      # Deliberately placed BEFORE the tests: lint failures are cheap to produce and cheap to
      # read, and there is no value in spending a test run to tell someone about a missing
      # `for` attribute.
      - name: Lint
        run: npm run lint

      # The Vitest specs existed but were never run here, so a broken spec could merge
      # while CI stayed green — the harness was proving nothing. --no-watch is required:
      # the default watch mode never exits and would hang the runner until timeout.
      - name: Test (Vitest, headless)
        run: npm test -- --no-watch

      - name: Build (production)
        run: npm run build -- --configuration production
