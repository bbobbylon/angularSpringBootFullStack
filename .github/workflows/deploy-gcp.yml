# ──────────────────────────────────────────────────────────────────────────────
# Deploy (GCP) — build the Docker image, push to Artifact Registry, deploy Cloud Run.
#
# The GCP counterpart of deploy.yml (which targets AWS ECS). Reuses the same Dockerfile.
# Database: Aiven managed MySQL (db3) over public TLS — same as the AWS path. Only the DB
# password + app secrets live in Secret Manager; everything non-sensitive is env/GitHub Secrets.
#
# Triggers:
#   - Push to master            → deploys to PROD  (the live path since 2026-09-05 — AWS is
#                                 paused for cost; deploy.yml is manual-only. See gcp/README.md)
#   - Manual workflow_dispatch  → deploys to the selected environment (qa/stage/prod)
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   GCP_PROJECT_ID      — GCP project id
#   GCP_REGION          — e.g. us-central1
#   GCP_SA_KEY          — deployer service-account JSON key (tessera-deployer@…)
#                         (or switch to Workload Identity Federation — see the auth step)
#   GCP_RUNTIME_SA      — runtime SA email, e.g. tessera-run@<project>.iam.gserviceaccount.com
#   AR_REPO             — Artifact Registry repo name, e.g. tessera-app
#   CLOUD_RUN_SERVICE   — Cloud Run service name, e.g. tessera-app
#   AIVEN_HOST / AIVEN_PORT / AIVEN_DB / AIVEN_USER — Aiven connection (non-sensitive)
#   APP_DOMAIN          — public app URL (https://tesseraapp.dev — the domain does not change
#                         with the cloud, so no OAuth callback URL changes are needed)
#   S3_BUCKET / AWS_REGION — the EXISTING AWS bucket for profile images (same secrets deploy.yml
#                         uses). Cloud Run's disk is ephemeral, so avatars live in S3 on this path too.
#
# Secret Manager entries referenced below are created by gcp/secrets-setup.sh.
# ──────────────────────────────────────────────────────────────────────────────
name: Deploy (GCP Cloud Run)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: prod
        type: choice
        options: [qa, stage, prod]
  # Auto-deploy on every push to master (moved here from deploy.yml on 2026-09-05).
  push:
    branches: [master]

jobs:
  # Same gate as the AWS pipeline: run the full CI suite before building or shipping.
  verify:
    name: Verify (CI)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Build → Artifact Registry → Cloud Run
    runs-on: ubuntu-latest
    needs: verify
    # Binds the run to a GitHub Environment, so qa/stage/prod can carry their own
    # secrets and required reviewers rather than all sharing the repository-level set.
    environment: ${{ github.event.inputs.environment || 'prod' }}
    env:
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPO }}/${{ secrets.CLOUD_RUN_SERVICE }}:${{ github.sha }}
      TARGET_ENV: ${{ github.event.inputs.environment || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Service-account key auth (simplest). For keyless auth, replace `credentials_json`
      # with `workload_identity_provider` + `service_account` (Workload Identity Federation).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build --tag "$IMAGE" --tag "${IMAGE%:*}:latest" .
          docker push "$IMAGE"
          docker push "${IMAGE%:*}:latest"

      # --max-instances 1 is a CORRECTNESS setting, not a cost one: the rate limiter keeps its
      # buckets in-process (FUTURE-ENHANCEMENTS.md §2.4), so a second instance silently doubles
      # every caller's budget. Raise it only together with that work.
      # --cpu-boost gives the JVM extra CPU during startup, roughly halving the scale-from-zero
      # cold start; --min-instances 0 is what makes the idle service free.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --service-account "${{ secrets.GCP_RUNTIME_SA }}" \
            --cpu 1 --memory 1Gi --cpu-boost --min-instances 0 --max-instances 1 \
            --set-env-vars "^##^SPRING_ACTIVE_PROFILES=${TARGET_ENV}##SPRING_DATASOURCE_URL=jdbc:mysql://${{ secrets.AIVEN_HOST }}:${{ secrets.AIVEN_PORT }}/${{ secrets.AIVEN_DB }}?sslMode=REQUIRED##SPRING_DATASOURCE_USERNAME=${{ secrets.AIVEN_USER }}##MAIL_HOST=smtp.gmail.com##MAIL_PORT=587##UI_APP_URL=${{ secrets.APP_DOMAIN }}##VERIFY_EMAIL_HOST=${{ secrets.APP_DOMAIN }}##CONTAINER_PORT=8080##IMAGE_STORAGE_PATH=/tmp/images##MICROSOFT_TENANT_ID=common##IMAGE_STORAGE_TYPE=s3##AWS_S3_BUCKET=${{ secrets.S3_BUCKET }}##AWS_REGION=${{ secrets.AWS_REGION }}##TRUSTED_PROXY_COUNT=1##FORWARD_HEADERS_STRATEGY=framework##OAUTH2_REDIRECT_BASE_URL=${{ secrets.APP_DOMAIN }}" \
            --set-secrets "SPRING_DATASOURCE_PASSWORD=tessera-db-password:latest,JWT_SECRET=tessera-jwt-secret:latest,MAIL_USERNAME=tessera-mail-username:latest,MAIL_PASSWORD=tessera-mail-password:latest,GOOGLE_CLIENT_ID=tessera-google-client-id:latest,GOOGLE_CLIENT_SECRET=tessera-google-client-secret:latest,GITHUB_CLIENT_ID=tessera-github-client-id:latest,GITHUB_CLIENT_SECRET=tessera-github-client-secret:latest,MICROSOFT_CLIENT_ID=tessera-microsoft-client-id:latest,MICROSOFT_CLIENT_SECRET=tessera-microsoft-client-secret:latest,TWILIO_ACCOUNT_SID=tessera-twilio-sid:latest,TWILIO_AUTH_TOKEN=tessera-twilio-token:latest,TWILIO_FROM_NUMBER=tessera-twilio-from-number:latest,AWS_ACCESS_KEY_ID=tessera-aws-access-key-id:latest,AWS_SECRET_ACCESS_KEY=tessera-aws-secret-access-key:latest"

      - name: Show service URL
        run: |
          echo "Deployed. URL:"
          gcloud run services describe "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --region "${{ secrets.GCP_REGION }}" --format='value(status.url)'
          echo "NOTE: set APP_DOMAIN (and your OAuth callback URLs) to this URL, then redeploy."
