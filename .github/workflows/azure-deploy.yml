# Azure deploy workflow — triggers on push to master.
#
# This is an alternative to the existing Azure DevOps Pipeline (`azure-pipelines.yml`).
# Use whichever one fits your workflow; running both for the same branch will create
# a deploy race.
#
# Prerequisites (one-time):
#   1. Deploy the Bicep template (or create the App Service + ACR by hand):
#        infrastructure/azure/main.bicep
#   2. Create an Azure AD application + federated credential for GitHub OIDC.
#      Guide: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
#   3. Set these GitHub repository secrets:
#        AZURE_CLIENT_ID         — service principal app (client) ID
#        AZURE_TENANT_ID         — Azure AD tenant ID
#        AZURE_SUBSCRIPTION_ID   — target subscription
#        AZURE_ACR_NAME          — e.g. 'securecapitaacr1234' (no .azurecr.io suffix)
#        AZURE_APP_SERVICE_NAME  — name of the App Service from Bicep output
#        AZURE_RESOURCE_GROUP    — e.g. 'bobsresourcegroup'

name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Push to ACR, Deploy to App Service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/securecapita:${{ github.sha }}
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/securecapita:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update App Service container image
        # Restart the App Service to pull the new image.
        # `az webapp config container set` updates the image reference;
        # the restart that follows it forces a fresh pull.
        run: |
          az webapp config container set \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_APP_SERVICE_NAME }} \
            --container-image-name ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/securecapita:${{ github.sha }}

          az webapp restart \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_APP_SERVICE_NAME }}

      - name: Wait for healthy
        # Poll the App Service URL until /actuator/health returns 200, or fail
        # the deploy after 5 minutes so we don't claim success on a broken rollout.
        run: |
          APP_URL=$(az webapp show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_APP_SERVICE_NAME }} \
            --query defaultHostName -o tsv)
          DEADLINE=$(( $(date +%s) + 300 ))
          while [ $(date +%s) -lt $DEADLINE ]; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$APP_URL/actuator/health" || echo 000)
            echo "https://$APP_URL/actuator/health → HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "App is healthy."; exit 0; }
            sleep 10
          done
          echo "::error::App did not become healthy within 5 minutes."
          exit 1
