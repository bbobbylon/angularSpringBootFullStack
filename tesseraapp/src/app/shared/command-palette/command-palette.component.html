<!--
  Command palette overlay. Rendered only while open() is true so it adds nothing to the
  DOM (and runs no listeners on its own subtree) when idle. The backdrop closes on click;
  the panel stops propagation so clicks inside it do not dismiss it.
-->
@if (open()) {
  <!--
    Click-to-dismiss backdrop. onBackdropClick checks the event target, so a click inside the
    dialog is simply not a backdrop click — which is why the panel needs no stopPropagation
    handler of its own.

    No keyboard handler here on purpose: Escape is caught document-wide by
    @HostListener('document:keydown') on the component, so the palette closes regardless of what
    holds focus. This element is role="presentation" and never takes focus, so a keydown bound to
    it could not fire.
  -->
  <div class="cmdk-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <div
      class="cmdk-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Command palette"
    >
      <!-- Search row -->
      <div class="cmdk-input-row">
        <i class="bi bi-search cmdk-input-icon" aria-hidden="true"></i>
        <input
          #searchInput
          type="text"
          class="cmdk-input"
          placeholder="Search pages and actions…"
          role="combobox"
          aria-expanded="true"
          aria-controls="cmdk-list"
          autocomplete="off"
          spellcheck="false"
          [value]="query()"
          (input)="onQueryChange(searchInput.value)"
          (keydown)="onInputKeydown($event)"
        />
        <kbd class="cmdk-esc">Esc</kbd>
      </div>

      <!-- Results, grouped by section; each row's flat index drives the highlight -->
      <ul id="cmdk-list" class="cmdk-list" role="listbox">
        @for (group of grouped(); track group.section) {
          <li class="cmdk-section" role="presentation">{{ group.section }}</li>
          @for (item of group.items; track item.command.id) {
            <li
              class="cmdk-item"
              role="option"
              [class.is-active]="item.index === activeIndex()"
              [attr.aria-selected]="item.index === activeIndex()"
              (mouseenter)="highlight(item.index)"
              (click)="run(item.command)"
              (keydown.enter)="run(item.command)"
              (keydown.space)="run(item.command)"
              tabindex="-1"
            >
              <span class="cmdk-item__icon"><i class="bi {{ item.command.icon }}" aria-hidden="true"></i></span>
              <span class="cmdk-item__label">{{ item.command.label }}</span>
              <span class="cmdk-item__hint">{{ item.command.hint }}</span>
            </li>
          }
        } @empty {
          <li class="cmdk-empty" role="presentation">No matches for “{{ query() }}”</li>
        }
      </ul>

      <!-- Keyboard legend -->
      <div class="cmdk-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>
}
