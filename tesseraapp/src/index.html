<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Set the color mode before first paint to avoid a flash of the wrong theme.
       Reads the persisted choice, falling back to the OS preference (default dark).
       Kept in lockstep with ThemeService (src/app/service/theme.service.ts). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sc-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    })();
  </script>
  <title>TesseraApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TesseraApp - Customer &amp; billing management platform">
  <meta name="theme-color" content="#0d6efd">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Fonts (IBM Plex Sans/Mono) and Bootstrap Icons are SELF-HOSTED, not loaded from
       Google Fonts or a CDN. They used to be linked from fonts.googleapis.com and
       cdn.jsdelivr.net, which broke in production: Spring Boot serves this document out
       of src/main/resources/static/ and applies the CSP from SecurityConfig, whose
       `style-src 'self'` and `font-src 'self'` directives blocked both. Local `ng serve`
       sends no CSP, so it only ever failed once deployed. They now come through the
       bundled stylesheet (see the `styles` array in angular.json and src/fonts.css),
       which also removes two third-party DNS + TLS handshakes from the critical path. -->
  <!-- Cloudflare Turnstile widget script (FUTURE-ENHANCEMENTS.md §3.1). The one deliberate
       exception to the self-hosted-assets rule above: a CAPTCHA cannot be self-hosted, since
       its entire job is proving the browser is talking to Cloudflare, not to this origin.
       `async defer` so it never blocks first paint; harmless when RegisterComponent's
       `turnstileSiteKey` is unset (dev) — it just attaches `window.turnstile` and nothing
       calls `.render()`. Allowed by SecurityConfig's CSP (script-src/connect-src/frame-src). -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
