services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    ports:
      - "${APP_PORT:-8090}:8080"
    env_file:
      - .env
    environment:
      # Switch environments by setting SPRING_ACTIVE_PROFILES in your .env file:
      #   dev   → local defaults, ddl-auto:update, SQL logging opt-in
      #   qa    → validate schema, show-sql opt-in, no fallback secrets
      #   stage → prod-mirror, validate schema, show-sql off
      #   prod  → (default) validate schema, show-sql off, jwt guard active
      # Or override on the CLI: docker compose --env-file .env.qa up
      SPRING_ACTIVE_PROFILES: ${SPRING_ACTIVE_PROFILES:-prod}
      # Override local .env values that are wrong inside Docker networking
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      # PREFERRED rather than the old useSSL=false: this hop stays inside the compose network,
      # but PREFERRED encrypts it anyway when the MySQL image offers TLS (it does, via its
      # auto-generated certs) and falls back silently when it does not — so there is no reason
      # to opt out explicitly. Deployed profiles pin REQUIRED; see application.yml.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?sslMode=PREFERRED&allowPublicKeyRetrieval=true"
      CONTAINER_PORT: 8080
      UI_APP_URL: "http://localhost:${APP_PORT:-8090}"
      # Profile images live on a named volume so they survive container restarts.
      IMAGE_STORAGE_PATH: /app/data/images
    volumes:
      - app-images:/app/data/images
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  app-images:
