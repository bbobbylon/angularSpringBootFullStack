# ─────────────────────────────────────────────────────────────────────────────
# Local development & production-like Docker stack.
#
# Services:
#   app      — Spring Boot JAR (with Angular SPA embedded), port 8080
#   mysql    — MySQL 8.4 LTS, port 3306, persistent volume, auto-runs schema.sql
#   adminer  — lightweight web DB UI, port 8081 — visit http://localhost:8081
#
# Secrets are read from .env (not committed). Copy .env.example to .env first.
#
# Usage:
#   ./deploy.sh         # build, start, wait for healthy, tail logs
#   docker compose up   # plain start (foreground)
#   docker compose down # stop and remove containers (volume kept)
#   docker compose down -v   # also wipe DB volume — fresh slate next start
# ─────────────────────────────────────────────────────────────────────────────

services:
  mysql:
    image: mysql:8.4
    container_name: securecapita-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db2}
    ports:
      # Host port (configurable via MYSQL_HOST_PORT, default 3307) → container 3306.
      # Default 3307 so a native MySQL on 3306 can coexist on the developer machine.
      # The app container always talks to MySQL on the docker network at `mysql:3306`,
      # regardless of this host-side mapping. Remove this block in production-like
      # setups where the DB shouldn't be reachable from outside the docker network.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # No init scripts mounted here.
      #
      # Schema is owned by Flyway, applied by the Spring Boot app on startup from
      # src/main/resources/db/migration/V<N>__*.sql. Keeping schema management in
      # the application — not in the database container's bootstrap — means:
      #   * One execution path for dev / qa / stage / prod
      #   * Idempotent: re-runs are no-ops once recorded in flyway_schema_history
      #   * Reviewable: migrations are versioned files, tracked in git
      # See src/main/resources/db/migration/V1__baseline_schema.sql.
      #
      # To seed real data (one-time import from a native MySQL dump), see
      # documentation/DATA_IMPORT.md.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: securecapita-app:local
    container_name: securecapita-app
    restart: unless-stopped
    depends_on:
      mysql:
        # Don't start the app until MySQL is actually ready to accept connections —
        # not just "container started." Avoids the classic boot-race flake.
        condition: service_healthy
    environment:
      # All values default to the local-docker configuration but every one is
      # overridable via .env.<env>, so the same compose file serves local / dev /
      # qa / stage / prod. See .env.local.example for the full list.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-db2}?useSSL=false&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      # When the app uses the sidecar mysql container, the DB password is
      # MYSQL_ROOT_PASSWORD; when pointed at an external DB, set this directly
      # in the .env.<env> file via SPRING_DATASOURCE_PASSWORD and it wins.
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      # Host port is configurable via APP_PORT in .env (default 8090) so it doesn't
      # clash with a native Spring Boot dev server already on 8080. The container
      # still listens on 8080 internally — matches production exactly.
      - "${APP_PORT:-8090}:8080"
    networks:
      - app-network

  adminer:
    image: adminer:5
    container_name: securecapita-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    name: securecapita-mysql-data
