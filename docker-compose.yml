services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    ports:
      - "${APP_PORT:-8090}:8080"
    env_file:
      - .env
    environment:
      # Override local .env values that are wrong inside Docker networking
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true"
      CONTAINER_PORT: 8080
      UI_APP_URL: "http://localhost:${APP_PORT:-8090}"
      # Profile images live on a named volume so they survive container restarts.
      IMAGE_STORAGE_PATH: /app/data/images
    volumes:
      - app-images:/app/data/images
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  app-images:
